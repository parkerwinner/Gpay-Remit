apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpay-remit-frontend
  labels:
    app: gpay-remit-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gpay-remit-frontend
  template:
    metadata:
      labels:
        app: gpay-remit-frontend
    spec:
      containers:
        - name: frontend
          image: gpay-remit-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gpay-remit-frontend
spec:
  selector:
    app: gpay-remit-frontend
  ports:
    - port: 80
      targetPort: 80
