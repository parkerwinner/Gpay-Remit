openapi: 3.0.3
info:
  title: Gpay-Remit API
  description: |
    REST API for the Gpay-Remit cross-border payment platform built on Stellar.

    ## Authentication
    All protected endpoints require a Bearer JWT token in the `Authorization` header.
    Obtain a token via `POST /api/v1/auth/login`.

    ## Versioning
    The API supports two versions:
    - **v1** — deprecated, still functional
    - **v2** — current, recommended

    Set the desired version via the `Accept-Version` header or use the versioned path prefix (`/api/v1/` or `/api/v2/`).
  version: "2.0.0"
  contact:
    name: Gpay-Remit Team

servers:
  - url: http://localhost:8080/api/v1
    description: Local development (v1)
  - url: http://localhost:8080/api/v2
    description: Local development (v2)

tags:
  - name: Auth
    description: Authentication and token management
  - name: Remittances
    description: Cross-border payment operations
  - name: Invoices
    description: Invoice creation and retrieval
  - name: Fees
    description: Fee calculation
  - name: Webhooks
    description: Webhook subscription management
  - name: Analytics
    description: Transaction analytics (admin only)
  - name: Audit
    description: Audit log access (admin only)
  - name: Contacts
    description: Address book and recipient management
  - name: Payment Requests
    description: Requesting and settling payments between users
  - name: Search
    description: Transaction search
  - name: Exchange Rates
    description: Currency exchange rates
  - name: Admin
    description: Operational controls (admin only)
  - name: Health
    description: Service health and readiness probes (served at the root, not under /api/vN)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PaymentRequestID:
      in: path
      name: id
      required: true
      schema:
        type: integer

  # Rate-limit headers (#382). Rate-limited routes return these on every
  # response; Retry-After is only present on 429 responses.
  headers:
    X-RateLimit-Limit:
      description: Maximum number of requests allowed per rate-limit window for this caller and endpoint.
      schema:
        type: integer
        example: 30
    X-RateLimit-Remaining:
      description: Requests remaining in the current window. Present on 429 responses too, where it is `0`.
      schema:
        type: integer
        minimum: 0
        example: 12
    X-RateLimit-Reset:
      description: Unix timestamp (seconds) at which the current window resets.
      schema:
        type: integer
        example: 1763800000
    Retry-After:
      description: Seconds to wait before retrying. Rounded up and never less than 1. Present only on 429 responses.
      schema:
        type: integer
        minimum: 1
        example: 12

  responses:
    TooManyRequests:
      description: Rate limit exceeded for this caller and endpoint. Wait at least `Retry-After` seconds before retrying.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: "Invalid request body"

    RegisterRequest:
      type: object
      required: [email, password, first_name, last_name]
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          minLength: 8
          example: "s3cur3P@ss!"
        first_name:
          type: string
          example: Alice
        last_name:
          type: string
          example: Smith

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          example: "s3cur3P@ss!"

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIs..."
        refresh_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIs..."
        user:
          $ref: '#/components/schemas/User'

    Contact:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 42
        nickname:
          type: string
          example: Alice Personal
        stellar_address:
          type: string
          example: GBZC6YRFWINCGYH6FFIK3VY4KF3WZJQR7CD3S5Y4GVNIKU5RM3JY7YEX
        currency:
          type: string
          example: USDC
        email:
          type: string
          example: alice@example.com
        notes:
          type: string
          example: Friend in London
        verification_status:
          type: string
          enum: [pending, verified, failed]
          example: verified
        is_verified:
          type: boolean
          example: true

    CreateContactRequest:
      type: object
      required: [nickname, stellar_address]
      properties:
        nickname:
          type: string
          example: Alice Personal
        stellar_address:
          type: string
          example: GBZC6YRFWINCGYH6FFIK3VY4KF3WZJQR7CD3S5Y4GVNIKU5RM3JY7YEX
        currency:
          type: string
          example: USDC
        email:
          type: string
          example: alice@example.com
        notes:
          type: string
          example: Friend in London

    UpdateContactRequest:
      type: object
      properties:
        nickname:
          type: string
        stellar_address:
          type: string
        currency:
          type: string
        email:
          type: string
        notes:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
          example: 42
        email:
          type: string
          example: alice@example.com
        first_name:
          type: string
          example: Alice
        last_name:
          type: string
          example: Smith
        role:
          type: string
          example: user
        created_at:
          type: string
          format: date-time

    Payment:
      type: object
      properties:
        id:
          type: integer
          example: 1
        sender_id:
          type: integer
          example: 42
        recipient_id:
          type: integer
          example: 99
        sender_account:
          type: string
          example: "GAAZI4TCR3TY5OJHCTJC2A4QSY6CJWJH5IAJTGKIN2ER7LBNVKOCCWN"
        recipient_account:
          type: string
          example: "GBYNR2QJXLBCBTRN44MRORCMI4YO7FZPFBCNOKTLF24TBDTU6TZXNDO"
        amount:
          type: number
          format: double
          example: 500.00
        currency:
          type: string
          example: USDC
        target_currency:
          type: string
          example: EUR
        status:
          type: string
          enum: [pending, completed, failed, cancelled]
          example: pending
        fee:
          type: number
          format: double
          example: 2.50
        notes:
          type: string
        created_at:
          type: string
          format: date-time

    CreateRemittanceRequest:
      type: object
      required: [sender_account, recipient_account, amount, asset_code]
      properties:
        sender_account:
          type: string
          example: "GAAZI4TCR3TY5OJHCTJC2A4QSY6CJWJH5IAJTGKIN2ER7LBNVKOCCWN"
        recipient_account:
          type: string
          example: "GBYNR2QJXLBCBTRN44MRORCMI4YO7FZPFBCNOKTLF24TBDTU6TZXNDO"
        amount:
          type: number
          format: double
          minimum: 0.0000001
          example: 500.00
        asset_code:
          type: string
          example: USDC
        asset_issuer:
          type: string
          example: "GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5"
        notes:
          type: string

    Invoice:
      type: object
      properties:
        id:
          type: integer
          example: 7
        payment_id:
          type: integer
          example: 1
        invoice_no:
          type: string
          example: "INV-1710000000-1"
        issuer_id:
          type: integer
          example: 42
        recipient_id:
          type: integer
          example: 99
        amount:
          type: number
          format: double
          example: 500.00
        currency:
          type: string
          example: USDC
        status:
          type: string
          enum: [unpaid, paid, overdue, cancelled]
          example: unpaid
        description:
          type: string
        due_date:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    ListInvoicesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 20
        total_count:
          type: integer
          format: int64
          example: 42

    FeeBreakdown:
      type: object
      properties:
        platform_fee:
          type: number
          example: 1.25
        forex_fee:
          type: number
          example: 0.63
        compliance_fee:
          type: number
          example: 0.25
        network_fee:
          type: number
          example: 0.38
        total_fee:
          type: number
          example: 2.51

    Webhook:
      type: object
      properties:
        id:
          type: integer
          example: 3
        url:
          type: string
          format: uri
          example: "https://example.com/webhook"
        events:
          type: array
          items:
            type: string
          example: ["payment.completed", "payment.failed"]
        active:
          type: boolean
        created_at:
          type: string
          format: date-time

    DependencyStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy, unconfigured]
          example: healthy
        latency:
          type: string
          example: "2.3ms"
        error:
          type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded]
          example: healthy
        service:
          type: string
          example: gpay-remit-api
        timestamp:
          type: string
          format: date-time
        dependencies:
          type: object
          properties:
            database:
              $ref: '#/components/schemas/DependencyStatus'
            horizon:
              $ref: '#/components/schemas/DependencyStatus'
            redis:
              $ref: '#/components/schemas/DependencyStatus'

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: alice@example.com
              password: "s3cur3P@ss!"
              first_name: Alice
              last_name: Smith
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: Obtain JWT access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired refresh token

  /remittances:
    get:
      tags: [Remittances]
      summary: List remittances (paginated)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
        '401':
          description: Unauthorized
    post:
      tags: [Remittances]
      summary: Send a remittance (simple)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sender_id, recipient_id, amount, currency]
              properties:
                sender_id:
                  type: integer
                recipient_id:
                  type: integer
                amount:
                  type: number
                  minimum: 0.0000001
                currency:
                  type: string
                target_currency:
                  type: string
                notes:
                  type: string
      responses:
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Validation error

  /remittances/create:
    post:
      tags: [Remittances]
      summary: Create a Stellar-backed remittance with escrow
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRemittanceRequest'
      responses:
        '201':
          description: Remittance initiated; returns unsigned Stellar XDR envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  remittance_id:
                    type: integer
                  status:
                    type: string
                  fee_breakdown:
                    $ref: '#/components/schemas/FeeBreakdown'
                  tx_envelope:
                    type: string
                    description: Base64-encoded XDR transaction envelope to be signed
                  message:
                    type: string
        '400':
          description: Invalid Stellar account or request body
        '401':
          description: Unauthorized

  /remittances/{id}:
    get:
      tags: [Remittances]
      summary: Get a single remittance by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Payment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Not found

  /remittances/{id}/complete:
    post:
      tags: [Remittances]
      summary: Mark a remittance as completed (admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Payment marked completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '403':
          description: Admin role required
        '404':
          description: Not found

  /invoices:
    get:
      tags: [Invoices]
      summary: List invoices for the authenticated user
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [unpaid, paid, overdue, cancelled]
          description: Filter by invoice status
        - in: query
          name: from
          schema:
            type: string
            format: date
          description: "Filter invoices created on or after this date (YYYY-MM-DD)"
        - in: query
          name: to
          schema:
            type: string
            format: date
          description: "Filter invoices created on or before this date (YYYY-MM-DD)"
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated list of invoices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInvoicesResponse'
        '401':
          description: Unauthorized
    post:
      tags: [Invoices]
      summary: Create a new invoice
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_id, issuer_id, recipient_id, amount, currency]
              properties:
                payment_id:
                  type: integer
                issuer_id:
                  type: integer
                recipient_id:
                  type: integer
                amount:
                  type: number
                  minimum: 0.0000001
                currency:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          description: Validation error

  /invoices/{id}:
    get:
      tags: [Invoices]
      summary: Get a single invoice by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Invoice details with payment info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '404':
          description: Not found

  /fees/calculate:
    get:
      tags: [Fees]
      summary: Calculate fees for a given amount
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: amount
          required: true
          schema:
            type: number
          example: 500.00
      responses:
        '200':
          description: Fee breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeBreakdown'

  /webhooks:
    get:
      tags: [Webhooks]
      summary: List registered webhooks
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Webhook list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'
    post:
      tags: [Webhooks]
      summary: Register a new webhook
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  type: string
                  format: uri
                events:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Webhook registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'

  /webhooks/{id}:
    get:
      tags: [Webhooks]
      summary: Get webhook by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Webhook details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '404':
          description: Not found
    put:
      tags: [Webhooks]
      summary: Update a webhook
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                events:
                  type: array
                  items:
                    type: string
                active:
                  type: boolean
      responses:
        '200':
          description: Webhook updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
    delete:
      tags: [Webhooks]
      summary: Delete a webhook
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted

  /webhooks/{id}/deliveries:
    get:
      tags: [Webhooks]
      summary: List delivery attempts for a webhook
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Delivery list

  /webhooks/deliveries/{delivery_id}/retry:
    post:
      tags: [Webhooks]
      summary: Retry a failed webhook delivery
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: delivery_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Delivery retried

  /analytics/volume:
    get:
      tags: [Analytics]
      summary: Transaction volume metrics (admin)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [day, week, month]
            default: day
      responses:
        '200':
          description: Volume metrics
        '403':
          description: Admin role required

  /analytics/fees:
    get:
      tags: [Analytics]
      summary: Fee breakdown analytics (admin)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Fee analytics
        '403':
          description: Admin role required

  /analytics/success-rate:
    get:
      tags: [Analytics]
      summary: Transaction success rate metrics (admin)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success rate data
        '403':
          description: Admin role required

  /analytics/top-corridors:
    get:
      tags: [Analytics]
      summary: Top payment corridors (admin)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Top corridors data
        '403':
          description: Admin role required

  /audit/logs:
    get:
      tags: [Audit]
      summary: List audit log entries (admin)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Audit log entries
        '403':
          description: Admin role required

  /contacts:
    get:
      tags: [Contacts]
      summary: List address book contacts
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact'
    post:
      tags: [Contacts]
      summary: Create new contact in address book
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContactRequest'
      responses:
        '201':
          description: Contact created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'

  /contacts/{id}:
    get:
      tags: [Contacts]
      summary: Get contact by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Contact details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '404':
          description: Contact not found
    put:
      tags: [Contacts]
      summary: Update contact
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContactRequest'
      responses:
        '200':
          description: Contact updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
    delete:
      tags: [Contacts]
      summary: Delete contact
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Contact deleted

  /contacts/{id}/verify:
    post:
      tags: [Contacts]
      summary: Verify contact on Stellar network
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Contact verification result

  /transactions/export:
    get:
      tags: [Audit]
      summary: Export transactions as CSV
      security:
        - BearerAuth: []
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /search/transactions:
    get:
      tags: [Search]
      summary: Search the authenticated user's transactions
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            maxLength: 200
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Matching transactions
        '400':
          description: Invalid search query

  /analytics/sla:
    get:
      tags: [Analytics]
      summary: SLA compliance and latency metrics (admin)
      description: Returns operational SLA tracking metrics including 99.9% uptime and <500ms p95 latency targets.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [daily, weekly, monthly, yearly]
            default: daily
          description: Aggregation period
        - in: query
          name: start_date
          schema:
            type: string
            format: date
          description: Custom start date (YYYY-MM-DD)
        - in: query
          name: end_date
          schema:
            type: string
            format: date
          description: Custom end date (YYYY-MM-DD)
      responses:
        '200':
          description: SLA metrics report
        '403':
          description: Admin role required

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      description: Always returns 200 so callers cannot probe which emails are registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent if the account exists
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  format: password
      responses:
        '200':
          description: Password reset
        '400':
          description: Invalid or expired token, or weak password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/request-unlock:
    post:
      tags: [Auth]
      summary: Request an account unlock email after lockout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Unlock email sent if the account is locked
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/unlock:
    post:
      tags: [Auth]
      summary: Unlock a locked account using an unlock token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Account unlocked
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users:
    post:
      tags: [Auth]
      summary: Register a new user (alias of POST /auth/register)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current access token
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out
        '401':
          description: Missing or invalid token

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change the authenticated user's password
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
      responses:
        '200':
          description: Password changed
        '400':
          description: Validation error or weak password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Current password is wrong or token invalid

  /auth/mfa/setup:
    post:
      tags: [Auth]
      summary: Start TOTP MFA enrolment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: TOTP secret and QR code to scan
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                  qr_code:
                    type: string
                    description: Base64-encoded PNG
        '401':
          description: Wrong password or invalid token

  /auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Confirm MFA enrolment with a TOTP code
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: MFA enabled
        '400':
          description: Invalid code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/mfa/disable:
    post:
      tags: [Auth]
      summary: Disable MFA for the authenticated user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: MFA disabled
        '401':
          description: Wrong password or invalid token

  /auth/mfa/status:
    get:
      tags: [Auth]
      summary: Whether MFA is enabled for the authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: MFA status
          content:
            application/json:
              schema:
                type: object
                properties:
                  mfa_enabled:
                    type: boolean
        '404':
          description: User not found

  /payment-requests:
    post:
      tags: [Payment Requests]
      summary: Request a payment from another user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_user_id, amount, currency, asset_code]
              properties:
                target_user_id:
                  type: integer
                amount:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Amount in minor units
                currency:
                  type: string
                  example: USD
                asset_code:
                  type: string
                  example: USDC
                asset_issuer:
                  type: string
                description:
                  type: string
                reference:
                  type: string
                expires_in_hours:
                  type: integer
      responses:
        '201':
          description: Payment request created
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Payment Requests]
      summary: List payment requests sent or received by the user
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
          description: Filter by status
      responses:
        '200':
          description: Payment requests

  /payment-requests/{id}:
    get:
      tags: [Payment Requests]
      summary: Get a payment request
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentRequestID'
      responses:
        '200':
          description: Payment request
        '404':
          description: Not found

  /payment-requests/{id}/accept:
    post:
      tags: [Payment Requests]
      summary: Accept and pay a payment request
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentRequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sender_account]
              properties:
                sender_account:
                  type: string
                  description: Stellar account the payment is sent from
      responses:
        '200':
          description: Accepted
        '400':
          description: Request is not pending or body is invalid
        '404':
          description: Not found

  /payment-requests/{id}/reject:
    post:
      tags: [Payment Requests]
      summary: Reject a payment request
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentRequestID'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Rejected
        '404':
          description: Not found

  /payment-requests/{id}/cancel:
    post:
      tags: [Payment Requests]
      summary: Cancel a payment request you created
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentRequestID'
      responses:
        '200':
          description: Cancelled
        '404':
          description: Not found

  /exchange-rates:
    get:
      tags: [Exchange Rates]
      summary: Get the exchange rate between two currencies
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
            example: USD
        - in: query
          name: to
          required: true
          schema:
            type: string
            example: NGN
      description: |
        Rate-limited to 30 lookups per minute per authenticated user (per client IP
        when no user is present). Every response carries the `X-RateLimit-*` headers.
        A 429 response also carries `Retry-After`, the number of seconds to wait
        before retrying. The 429 body includes `retry_after` and `reset_at`.
      responses:
        '200':
          description: Exchange rate
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
        '400':
          description: Missing or unsupported currency
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/rate-limit/reset:
    post:
      tags: [Admin]
      summary: Reset rate-limit counters for a user (admin)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            type: string
        - in: query
          name: endpoint
          schema:
            type: string
          description: Limit the reset to one endpoint
      responses:
        '200':
          description: Counters reset
        '400':
          description: user_id is required
        '403':
          description: Admin role required

  /admin/rate-limit/view:
    get:
      tags: [Admin]
      summary: View current rate-limit counters (admin)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: user_id
          schema:
            type: string
          description: Show one user; omit for all users
      responses:
        '200':
          description: Rate-limit counters
        '403':
          description: Admin role required

  /remittances/batch:
    post:
      tags: [Remittances]
      summary: Create multiple pending remittances atomically in one batch
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sender_account, asset_code, payments]
              properties:
                sender_account:
                  type: string
                asset_code:
                  type: string
                asset_issuer:
                  type: string
                payments:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [recipient_account, amount]
                    properties:
                      recipient_account:
                        type: string
                      amount:
                        type: integer
                        format: int64
                      conditions:
                        type: object
                      notes:
                        type: string
      responses:
        '201':
          description: Batch remittances created
        '400':
          description: Validation error (per-item errors or batch size exceeded)
        '401':
          description: Unauthorized
        '403':
          description: Sender account does not belong to authenticated user

  /templates:
    get:
      tags: [Remittances]
      summary: List payment templates for the authenticated user
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: page_size
          schema:
            type: integer
      responses:
        '200':
          description: List of payment templates
        '401':
          description: Unauthorized
    post:
      tags: [Remittances]
      summary: Create a payment template
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_name, recipient_account, amount, asset_code]
              properties:
                template_name:
                  type: string
                recipient_account:
                  type: string
                amount:
                  type: number
                asset_code:
                  type: string
                asset_issuer:
                  type: string
                notes:
                  type: string
      responses:
        '201':
          description: Template created
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /templates/{id}:
    get:
      tags: [Remittances]
      summary: Get a payment template by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Payment template
        '403':
          description: Forbidden
        '404':
          description: Not found
    put:
      tags: [Remittances]
      summary: Update a payment template
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Template updated
        '400':
          description: Validation error
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      tags: [Remittances]
      summary: Delete a payment template
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Template deleted
        '403':
          description: Forbidden
        '404':
          description: Not found

  /templates/{id}/send:
    post:
      tags: [Remittances]
      summary: Send a remittance from a payment template
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Remittance created from template
        '400':
          description: Validation error
        '403':
          description: Forbidden
        '404':
          description: Not found

  /recurring-schedules:
    get:
      tags: [Remittances]
      summary: List recurring remittance schedules for the authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of recurring schedules
        '401':
          description: Unauthorized
    post:
      tags: [Remittances]
      summary: Create a recurring remittance schedule
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sender_account, recipient_account, amount, currency, frequency]
              properties:
                sender_account:
                  type: string
                recipient_account:
                  type: string
                amount:
                  type: integer
                  format: int64
                currency:
                  type: string
                asset_issuer:
                  type: string
                frequency:
                  type: string
                  enum: [daily, weekly, monthly]
                next_run_at:
                  type: string
                  format: date-time
                notes:
                  type: string
      responses:
        '201':
          description: Schedule created
        '400':
          description: Validation error
        '403':
          description: Forbidden

  /recurring-schedules/{id}:
    get:
      tags: [Remittances]
      summary: Get a recurring schedule by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Recurring schedule
        '403':
          description: Forbidden
        '404':
          description: Not found

  /recurring-schedules/{id}/pause:
    post:
      tags: [Remittances]
      summary: Pause an active recurring schedule
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Schedule paused
        '400':
          description: Invalid state transition

  /recurring-schedules/{id}/resume:
    post:
      tags: [Remittances]
      summary: Resume a paused recurring schedule
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Schedule resumed
        '400':
          description: Invalid state transition

  /recurring-schedules/{id}/cancel:
    post:
      tags: [Remittances]
      summary: Cancel a recurring schedule permanently
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Schedule cancelled

  /wallet/balances:
    get:
      tags: [Exchange Rates]
      summary: Get multi-currency wallet balances and preferred-currency estimates
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Wallet balances and conversion estimates
        '401':
          description: Unauthorized

  /wallet/preferences:
    get:
      tags: [Exchange Rates]
      summary: Get the authenticated user's preferred display currency
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Currency preference
        '401':
          description: Unauthorized
    put:
      tags: [Exchange Rates]
      summary: Update the authenticated user's preferred display currency
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferred_currency]
              properties:
                preferred_currency:
                  type: string
      responses:
        '200':
          description: Updated preference
        '400':
          description: Unsupported currency
        '401':
          description: Unauthorized

  /health:
    servers:
      - url: http://localhost:8080
        description: Health probes are served at the root
    get:
      tags: [Health]
      summary: Full health check with dependency status
      responses:
        '200':
          description: All dependencies healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: One or more dependencies degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/ready:
    servers:
      - url: http://localhost:8080
        description: Health probes are served at the root
    get:
      tags: [Health]
      summary: Kubernetes readiness probe
      responses:
        '200':
          description: Service ready
        '503':
          description: Service not ready

  /health/live:
    servers:
      - url: http://localhost:8080
        description: Health probes are served at the root
    get:
      tags: [Health]
      summary: Kubernetes liveness probe
      responses:
        '200':
          description: Service alive
