name: OpenAPI Spec Validation

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'backend/handlers/openapi.yaml'
      - 'backend/openapi_validation_test.go'
      - 'backend/openapi_routes_test.go'
      - 'backend/main.go'
      - 'backend/router.go'
      - 'backend/handlers/**'
      - 'backend/middleware/**'
      - 'docs/api/**'
      - 'scripts/validate_openapi.sh'
      - '.github/workflows/openapi-validation.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'backend/handlers/openapi.yaml'
      - 'backend/openapi_validation_test.go'
      - 'backend/openapi_routes_test.go'
      - 'backend/main.go'
      - 'backend/router.go'
      - 'backend/handlers/**'
      - 'backend/middleware/**'
      - 'docs/api/**'
      - 'scripts/validate_openapi.sh'
      - '.github/workflows/openapi-validation.yml'

jobs:
  validate-openapi:
    name: Validate OpenAPI Specification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Validate OpenAPI Specification
        run: |
          ./scripts/validate_openapi.sh
