name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-contracts:
    name: Test Smart Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}

      # --all-features also compiles and runs the feature-gated suites
      # (`prop` -> tests/prop_conditions.rs, `integration` ->
      # tests/integration_remittance.rs). tests/fuzz_*.rs are proptest-based
      # and run on every `cargo test`.
      #
      # Every run uses a known RNG seed (the run id, or the dispatch input),
      # printed below, so a failure can be replayed exactly (#376):
      #   PROPTEST_RNG_SEED=<seed> cargo test --features prop --test prop_conditions
      - name: Run contract tests (all features, incl. property/fuzz tests)
        working-directory: ./contracts
        env:
          PROPTEST_CASES: "256"
          PROPTEST_RNG_SEED: ${{ github.run_id }}
        run: |
          echo "PROPTEST_RNG_SEED=$PROPTEST_RNG_SEED (replay a failure locally with this seed)"
          echo "Property tests ran with \`PROPTEST_RNG_SEED=$PROPTEST_RNG_SEED\`" >> "$GITHUB_STEP_SUMMARY"
          cargo test --locked --all-features --no-fail-fast

      # proptest writes each failure's shrunk counterexample here; commit the
      # file to keep replaying that case first.
      - name: Upload proptest regressions
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proptest-regressions
          path: contracts/tests/*.proptest-regressions
          if-no-files-found: ignore

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          # Must satisfy the `go 1.25.0` directive in backend/go.mod; 1.24
          # cannot build the module at all.
          go-version: "1.25"

      - name: Run backend tests with coverage
        working-directory: ./backend
        env:
          REDIS_ADDR: localhost:6379
        run: |
          go mod download
          go vet ./...
          go build ./...
          # -covermode=atomic is required for -race; count mode is not
          # goroutine-safe and silently miscounts under concurrent tests.
          go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Report coverage summary
        working-directory: ./backend
        run: |
          go tool cover -func=coverage.out | tail -n 1
          echo "### Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -n 20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.out
          flags: backend
          name: backend-coverage
          # The repository is public, so uploads work without a token. Set
          # CODECOV_TOKEN in repository secrets if it is ever made private —
          # tokenless uploads fail there.
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Codecov outage must not fail an otherwise green build; the gate
          # that matters is the test run above.
          fail_ci_if_error: false

      - name: Archive coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 14

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          CI: false
        run: npm run build

      - name: Run frontend tests with coverage
        working-directory: ./frontend
        env:
          CI: true
        run: npm test -- --watchAll=false --coverage --passWithNoTests

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ./frontend/coverage
          flags: frontend
          name: frontend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
