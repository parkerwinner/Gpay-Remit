name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-contracts:
    name: Test Smart Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Run contract tests
        working-directory: ./contracts
        run: cargo test

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          # Must satisfy the `go 1.25.0` directive in backend/go.mod; 1.24
          # cannot build the module at all.
          go-version: "1.25"

      - name: Run backend tests with coverage
        working-directory: ./backend
        env:
          REDIS_ADDR: localhost:6379
        run: |
          go mod download
          go vet ./...
          go build ./...
          # -covermode=atomic is required for -race; count mode is not
          # goroutine-safe and silently miscounts under concurrent tests.
          go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Report coverage summary
        working-directory: ./backend
        run: |
          go tool cover -func=coverage.out | tail -n 1
          echo "### Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -n 20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.out
          flags: backend
          name: backend-coverage
          # The repository is public, so uploads work without a token. Set
          # CODECOV_TOKEN in repository secrets if it is ever made private —
          # tokenless uploads fail there.
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Codecov outage must not fail an otherwise green build; the gate
          # that matters is the test run above.
          fail_ci_if_error: false

      - name: Archive coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 14

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Run frontend tests with coverage
        working-directory: ./frontend
        run: npm test -- --watchAll=false --coverage

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ./frontend/coverage
          flags: frontend
          name: frontend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
