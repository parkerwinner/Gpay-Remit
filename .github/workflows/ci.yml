name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Manual (re)deployment of the contracts to testnet. Runs the test jobs
  # first; the deploy job only runs on main or on this trigger.
  workflow_dispatch:
    inputs:
      contracts:
        description: "Contracts to deploy (space-separated subset of: mock-oracle mock-kyc mock-aml escrow hub)"
        required: false
        default: "mock-oracle mock-kyc mock-aml escrow hub"
      skip_oversize:
        description: "Skip contracts over the network size limit instead of failing"
        type: boolean
        default: false

jobs:
  test-contracts:
    name: Test Smart Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32v1-none
          components: rustfmt, clippy

      - name: Audit contract dependency licenses
        working-directory: ./contracts
        run: |
          cargo install cargo-license --locked
          cargo license --avoid-dev-deps --color never > licenses.txt
          if grep -Ei "GPL|AGPL|LGPL|SSPL|BUSL" licenses.txt; then
            echo "Incompatible contract dependency license found"
            exit 1
          fi

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}

      - name: Check formatting
        working-directory: ./contracts
        run: cargo fmt --check

      - name: Run clippy
        working-directory: ./contracts
        run: cargo clippy --all-targets -- -D warnings

      # --all-features also compiles and runs the feature-gated suites
      # (`prop` -> tests/prop_conditions.rs, `integration` ->
      # tests/integration_remittance.rs). tests/fuzz_*.rs are proptest-based
      # and run on every `cargo test`.
      # Property tests use a fixed seed per run (the run id) so any failure can
      # be replayed locally with the command printed below.
      - name: Run contract tests (all features, incl. property/fuzz tests)
        working-directory: ./contracts
        env:
          PROPTEST_CASES: "256"
          PROPTEST_RNG_SEED: ${{ github.run_id }}
        run: |
          echo "Proptest seed: $PROPTEST_RNG_SEED"
          echo "Reproduce: cd contracts && PROPTEST_RNG_SEED=$PROPTEST_RNG_SEED PROPTEST_CASES=$PROPTEST_CASES cargo test --all-features"
          cargo test --locked --all-features --no-fail-fast

      - name: Validate contract regression snapshots
        run: python3 scripts/check_contract_snapshots.py

      - name: Upload proptest regressions
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proptest-regressions
          path: contracts/proptest-regressions/
          if-no-files-found: ignore

      # Each contract is a separate Wasm module (see contracts/Cargo.toml
      # features); building them catches exported-symbol collisions that
      # native test builds cannot.
      - name: Build contract Wasm
        working-directory: ./contracts
        run: |
          for contract in escrow hub mock-oracle mock-kyc mock-aml; do
            cargo build --locked --profile release-wasm --target wasm32v1-none --features "$contract"
            echo "$contract: $(wc -c < target/wasm32v1-none/release-wasm/gpay_remit_contracts.wasm) bytes (unoptimised)"
          done

  benchmark-contracts:
    name: Benchmark Contracts
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore latest main benchmark baseline
        id: criterion-cache
        uses: actions/cache/restore@v4
        with:
          path: contracts/target/criterion
          key: criterion-${{ runner.os }}-main-${{ github.sha }}
          restore-keys: criterion-${{ runner.os }}-main-

      - name: Benchmark the pull request base when no baseline is cached
        if: github.event_name == 'pull_request'
        run: |
          if ! find contracts/target/criterion -path '*/main/estimates.json' -print -quit 2>/dev/null | grep -q .; then
            git fetch origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            git worktree add /tmp/gpay-remit-benchmark-base "origin/$GITHUB_BASE_REF"
            cd /tmp/gpay-remit-benchmark-base/contracts
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/contracts/target" \
              cargo bench --locked --bench escrow_bench --bench remittance_bench -- --save-baseline main
          fi

      - name: Compare pull request benchmarks against main
        if: github.event_name == 'pull_request'
        working-directory: ./contracts
        run: cargo bench --locked --bench escrow_bench --bench remittance_bench -- --baseline main

      - name: Fail on benchmark regressions above 10 percent
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_criterion_regressions.py contracts/target/criterion

      - name: Save current main benchmark baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ./contracts
        run: cargo bench --locked --bench escrow_bench --bench remittance_bench -- --save-baseline main

      - name: Cache main benchmark baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.criterion-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: contracts/target/criterion
          key: criterion-${{ runner.os }}-main-${{ github.sha }}

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-benchmarks-${{ github.run_id }}
          path: contracts/target/criterion
          if-no-files-found: ignore
          retention-days: 30

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          # Must satisfy the `go 1.25.0` directive in backend/go.mod; 1.24
          # cannot build the module at all.
          go-version: "1.25"

      - name: Audit backend dependency licenses
        working-directory: ./backend
        run: |
          go install github.com/google/go-licenses@latest
          "$(go env GOPATH)/bin/go-licenses" report ./... > licenses.txt
          if grep -Ei "GPL|AGPL|LGPL|SSPL|BUSL" licenses.txt; then
            echo "Incompatible backend dependency license found"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: backend
          args: --timeout=5m

      - name: Configure Redis cache eviction policy
        env:
          REDIS_MAXMEMORY: 256mb
        run: |
          redis-cli -h localhost CONFIG SET maxmemory "$REDIS_MAXMEMORY"
          redis-cli -h localhost CONFIG SET maxmemory-policy allkeys-lru

      - name: Run backend tests with coverage
        working-directory: ./backend
        env:
          REDIS_ADDR: localhost:6379
        run: |
          go mod download
          go vet ./...
          go build ./...
          # -covermode=atomic is required for -race; count mode is not
          # goroutine-safe and silently miscounts under concurrent tests.
          go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Run authenticated remittance integration flow
        working-directory: ./backend
        run: go test -tags=integration -run '^TestIntegrationUserContactAndRemittanceFlow$' .

      - name: Report coverage summary
        working-directory: ./backend
        run: |
          go tool cover -func=coverage.out | tail -n 1
          echo "### Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -n 20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.out
          flags: backend
          name: backend-coverage
          # The repository is public, so uploads work without a token. Set
          # CODECOV_TOKEN in repository secrets if it is ever made private —
          # tokenless uploads fail there.
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Codecov outage must not fail an otherwise green build; the gate
          # that matters is the test run above.
          fail_ci_if_error: false

      - name: Archive coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 14

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Audit frontend dependency licenses
        working-directory: ./frontend
        run: |
          npx license-checker --production --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD"

      - name: Run frontend lint
        working-directory: ./frontend
        run: npm run lint

      - name: Check frontend formatting
        working-directory: ./frontend
        run: npm run format:check

      - name: Build frontend
        working-directory: ./frontend
        env:
          CI: false
        run: npm run build

      - name: Analyze frontend bundle and enforce size budgets
        working-directory: ./frontend
        run: npm run analyze:bundle

      - name: Run frontend tests with coverage
        working-directory: ./frontend
        env:
          CI: true
        run: npm test -- --watchAll=false --coverage --passWithNoTests

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ./frontend/coverage
          flags: frontend
          name: frontend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  e2e-cypress:
    name: E2E Cypress Viewport Tests
    runs-on: ubuntu-latest
    needs: [test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          CI: false
        run: npm run build

      - name: Run headless Cypress viewport specs
        working-directory: ./frontend
        run: |
          npx serve -s build -l 3000 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          npx wait-on http://localhost:3000
          npx cypress run --spec "e2e/mobile-responsive.cy.js"

  deploy-testnet:
    name: Deploy Contracts to Testnet
    needs: [test-contracts, test-backend, test-frontend]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: testnet
    concurrency:
      group: deploy-testnet
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      STELLAR_CLI_VERSION: "26.0.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('contracts/Cargo.lock') }}

      - name: Install Stellar CLI
        run: |
          curl -fsSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin stellar
          stellar --version

      # Builds, uploads, deploys and initialises every contract, then smoke
      # tests each one with read-only calls. Without the secret a throwaway
      # friendbot-funded deployer is used.
      - name: Deploy and smoke test
        env:
          NETWORK: testnet
          OUT_DIR: ${{ github.workspace }}/deployments
          STELLAR_DEPLOYER_SECRET: ${{ secrets.STELLAR_DEPLOYER_SECRET }}
          CONTRACTS: ${{ github.event.inputs.contracts || 'mock-oracle mock-kyc mock-aml escrow hub' }}
          SKIP_OVERSIZE: ${{ github.event.inputs.skip_oversize == 'true' && '1' || '0' }}
        run: ./scripts/deploy_contracts.sh

      - name: Publish deployment summary
        if: always() && hashFiles('deployments/testnet.json') != ''
        run: |
          {
            echo "### Testnet deployment (${GITHUB_SHA::7})"
            echo
            echo "| Contract | Status | Contract ID | Wasm bytes |"
            echo "| --- | --- | --- | --- |"
            jq -r '.contracts | to_entries[] | "| \(.key) | \(.value.status) | `\(.value.contract_id // "-")` | \(.value.wasm_bytes) |"' deployments/testnet.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployed contract addresses
        if: always() && hashFiles('deployments/testnet.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: testnet-contracts-${{ github.sha }}
          path: |
            deployments/testnet.json
            deployments/wasm/*.wasm
          retention-days: 90
