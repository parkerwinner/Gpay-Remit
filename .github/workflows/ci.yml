name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Manual run, e.g. to redeploy the contracts to testnet (#378) or replay
  # a property-test failure with its seed (#376).
  workflow_dispatch:
    inputs:
      deploy_contracts:
        description: "Contracts to deploy to testnet (space separated: escrow hub). Empty skips deployment."
        required: false
        default: "escrow hub"
      proptest_seed:
        description: "PROPTEST_RNG_SEED to replay a property-test run (empty = use the run id)"
        required: false
        default: ""

env:
  # Pinned to match the testnet protocol; bump together with the network.
  STELLAR_CLI_VERSION: "30.0.1"

jobs:
  test-contracts:
    name: Test Smart Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}

      # --all-features also compiles and runs the feature-gated suites
      # (`prop` -> tests/prop_conditions.rs, `integration` ->
      # tests/integration_remittance.rs). tests/fuzz_*.rs are proptest-based
      # and run on every `cargo test`.
      #
      # Every run uses a known RNG seed (the run id, or the dispatch input),
      # printed below, so a failure can be replayed exactly (#376):
      #   PROPTEST_RNG_SEED=<seed> cargo test --features prop --test prop_conditions
      - name: Run contract tests (all features, incl. property/fuzz tests)
        working-directory: ./contracts
        env:
          PROPTEST_CASES: "256"
          PROPTEST_RNG_SEED: ${{ inputs.proptest_seed || github.run_id }}
        run: |
          echo "PROPTEST_RNG_SEED=$PROPTEST_RNG_SEED (replay a failure locally with this seed)"
          echo "Property tests ran with \`PROPTEST_RNG_SEED=$PROPTEST_RNG_SEED\`" >> "$GITHUB_STEP_SUMMARY"
          cargo test --locked --all-features --no-fail-fast

      # proptest writes each failure's shrunk counterexample here; commit the
      # file to keep replaying that case first.
      - name: Upload proptest regressions
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proptest-regressions
          path: contracts/tests/*.proptest-regressions
          if-no-files-found: ignore

  # Builds the deployable wasm on every push and PR, so a change that breaks
  # the wasm build (e.g. two contracts exporting the same entry point) or
  # outgrows the network's size limit is caught before merge (#378).
  build-contracts-wasm:
    name: Build Contract Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('contracts/Cargo.lock') }}

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v30.0.1

      - name: Build and size-check every contract
        env:
          DRY_RUN: "1"
          DEPLOY_CONTRACTS: "escrow hub"
        run: ./scripts/deploy_contracts.sh

      - name: Upload wasm
        uses: actions/upload-artifact@v4
        with:
          name: contracts-wasm
          path: deployments/testnet/wasm/*.wasm
          retention-days: 14

  # Deploys to testnet on every push to main and on manual dispatch (#378).
  # Uses the TESTNET_DEPLOYER_SECRET secret when set (a stable admin key);
  # otherwise a fresh friendbot-funded identity becomes the admin.
  deploy-contracts-testnet:
    name: Deploy Contracts (testnet)
    needs: [test-contracts, build-contracts-wasm]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_contracts != '')
    runs-on: ubuntu-latest
    environment: testnet
    # Never run two deployments at once; never cancel one half way.
    concurrency:
      group: deploy-contracts-testnet
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('contracts/Cargo.lock') }}

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v30.0.1

      - name: Deploy, initialise and smoke-test
        env:
          NETWORK: testnet
          DEPLOY_CONTRACTS: ${{ inputs.deploy_contracts || vars.DEPLOY_CONTRACTS || 'escrow hub' }}
          STELLAR_DEPLOYER_SECRET: ${{ secrets.TESTNET_DEPLOYER_SECRET }}
        run: ./scripts/deploy_contracts.sh

      - name: Summarise deployment
        if: success()
        run: |
          {
            echo "### Testnet contract deployment"
            echo '```'
            cat deployments/testnet/contracts.env
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployed addresses and wasm
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testnet-contracts-${{ github.sha }}
          path: |
            deployments/testnet/contracts.json
            deployments/testnet/contracts.env
            deployments/testnet/wasm/*.wasm
          if-no-files-found: warn
          retention-days: 90

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          # Must satisfy the `go 1.25.0` directive in backend/go.mod; 1.24
          # cannot build the module at all.
          go-version: "1.25"

      - name: Run backend tests with coverage
        working-directory: ./backend
        env:
          REDIS_ADDR: localhost:6379
        run: |
          go mod download
          go vet ./...
          go build ./...
          # -covermode=atomic is required for -race; count mode is not
          # goroutine-safe and silently miscounts under concurrent tests.
          go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Report coverage summary
        working-directory: ./backend
        run: |
          go tool cover -func=coverage.out | tail -n 1
          echo "### Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -n 20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.out
          flags: backend
          name: backend-coverage
          # The repository is public, so uploads work without a token. Set
          # CODECOV_TOKEN in repository secrets if it is ever made private —
          # tokenless uploads fail there.
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Codecov outage must not fail an otherwise green build; the gate
          # that matters is the test run above.
          fail_ci_if_error: false

      - name: Archive coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 14

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          CI: false
        run: npm run build

      - name: Run frontend tests with coverage
        working-directory: ./frontend
        env:
          CI: true
        run: npm test -- --watchAll=false --coverage --passWithNoTests

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ./frontend/coverage
          flags: frontend
          name: frontend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
