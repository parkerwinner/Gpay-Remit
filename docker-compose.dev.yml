version: "3.8"

# Development overrides for local workflows
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENV: development
      LOG_LEVEL: debug
      PORT: 8080
      DATABASE_URL: postgres://gpay:gpay_password@postgres:5432/gpay_remit?sslmode=disable
      REDIS_URL: redis:6379
      STELLAR_NETWORK: testnet
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      HORIZON_URL: https://horizon-testnet.stellar.org
      JWT_SECRET: super-secret-development-jwt-key-32-chars-minimum
    volumes:
      - ./backend:/app:cached
    ports:
      - "8080:8080"
    command: ["go", "run", "main.go"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      REACT_APP_API_URL: http://localhost:8080/api/v1
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    ports:
      - "3000:3000"

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
